
name: Linux Inspection

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Bash syntax
        run: bash -n scripts/linux-inspect.sh

      - name: Inspect Linux environment
        run: bash scripts/linux-inspect.sh

        
      - name: Validate permissions script syntax
        run: bash -n scripts/linux-permissions.sh

      - name: Test Linux file permissions
        run: bash scripts/linux-permissions.sh

        
      - name: Validate process script syntax
        run: bash -n scripts/linux-processes.sh

      - name: Test Linux process management
        run: bash scripts/linux-processes.sh

        
      - name: Validate networking script syntax
        run: bash -n scripts/linux-network.sh

      - name: Inspect Linux networking
        run: bash scripts/linux-network.sh

        
      - name: Validate environment script syntax
        run: bash -n scripts/env-check.sh

      - name: Test default environment configuration
        run: bash scripts/env-check.sh

      - name: Test staging environment configuration
        env:
          APP_ENV: staging
          APP_PORT: '8080'
        run: bash scripts/env-check.sh






name: Docker CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t calculator-lab:ci .

      - name: Run Docker container
        run: |
          docker run --rm calculator-lab:ci
          echo "Container completed successfully!"

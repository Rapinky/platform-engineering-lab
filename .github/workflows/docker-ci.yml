
name: Docker CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build optimized image
        run: docker build -t calculator-lab:ci .

      - name: Run Docker container
        run: |
          docker run --rm calculator-lab:ci
          echo "Container completed successfully!"

      - name: Compare Docker image sizes
        run: |
          set -euo pipefail

          git fetch --no-tags --depth=1 origin main

          baseline_dir="$(mktemp -d)"
          trap 'rm -rf "$baseline_dir"' EXIT

          git archive origin/main | tar -x -C "$baseline_dir"

          docker build \
            -t calculator-lab:baseline \
            "$baseline_dir"

          baseline=$(docker image inspect calculator-lab:baseline --format '{{.Size}}')
          optimized=$(docker image inspect calculator-lab:ci --format '{{.Size}}')

          echo "Main image: $baseline bytes"
          echo "PR image: $optimized bytes"
          echo "Difference: $((baseline - optimized)) bytes"


name: Service Health Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-health:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate scripts
        run: |
          bash -n scripts/health-check.sh
          node --check scripts/health-server.mjs

      - name: Test service health
        run: |
          set -euo pipefail

          node scripts/health-server.mjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          echo "Waiting for test server..."
          ready=false
          for attempt in {1..20}; do
            if curl -fsS --max-time 1 \
              http://127.0.0.1:3000/health \
              > /dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            echo "ERROR: Server did not start"
            exit 1
          fi

          echo "Testing healthy response..."
          bash scripts/health-check.sh

          echo "Testing HTTP 503..."
          HEALTH_URL=http://127.0.0.1:3000/unhealthy \
            bash scripts/health-check.sh && exit 1

          echo "Testing HTTP 404..."
          HEALTH_URL=http://127.0.0.1:3000/missing \
            bash scripts/health-check.sh && exit 1

          echo "All health checks passed!"

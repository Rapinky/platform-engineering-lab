

name: My First CI Workflow


on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  
permissions:
  contents: read

jobs:
  hello-world:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Print a message
        run: echo "Hello from my first CI pipeline!"

      - name: Show the current date
        run: date
      
      - name: Run calculator tests
        run: npm test

      - name: Build application
        run: npm run build

        
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: calculator-build
          path: dist/
          if-no-files-found: error
          retention-days: 7

  verify-artifact:
    runs-on: ubuntu-latest
    needs: hello-world

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: calculator-build
          path: dist/

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate downloaded artifact
        run: |
          test -f dist/calculator.mjs
          node --check dist/calculator.mjs
          echo "Artifact validated successfully!"
